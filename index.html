<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #050204;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* =========================
   LOVE
========================= */

.heart {
  position: relative;
  width: 440px;
  height: 380px;
}

/* tulisan i love you */

.word {
  position: absolute;

  white-space: nowrap;

  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.2px;

  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(0.75);

  animation:
    appear 0.32s ease-out forwards;
}

/* deep maroon */

.maroon {
  color: #761f3a;

  text-shadow:
    0 0 4px rgba(118, 31, 58, 0.7);
}

/* pink */

.pink {
  color: #ff78a6;

  text-shadow:
    0 0 5px rgba(255, 120, 166, 0.8),
    0 0 10px rgba(255, 120, 166, 0.35);
}

@keyframes appear {

  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(0.65);
  }

  70% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1.06);
  }

  100% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1);
  }

}


/* =========================
   FINAL TEXT
========================= */

.final {
  margin-top: -10px;

  color: white;

  font-size: 19px;
  letter-spacing: 1.4px;

  opacity: 0;

  transform: translateY(8px);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;

  text-shadow:
    0 0 7px rgba(255, 120, 166, 0.65),
    0 0 16px rgba(118, 31, 58, 0.7);
}

.final.show {
  opacity: 1;
  transform: translateY(0);
}

.final span {
  color: #ff78a6;
  font-size: 23px;
}


/* =========================
   HP
========================= */

@media (max-width: 600px) {

  .heart {
    transform: scale(0.78);
  }

  .final {
    margin-top: -65px;
    font-size: 16px;
  }

}
</style>
</head>


<body>

<div class="wrapper">

  <div
    class="heart"
    id="heart">
  </div>


  <div
    class="final"
    id="final">

    i love you most bebe
    <span>♡</span>

  </div>

</div>


<script>

const heart =
  document.getElementById("heart");

const finalText =
  document.getElementById("final");


/*
========================================
MEMBUAT LOVE
========================================
*/

const rows = 25;
const cols = 33;

let words = [];


for (let row = 0; row < rows; row++) {

  for (let col = 0; col < cols; col++) {

    /*
    Koordinat X
    */

    const x =
      (col / (cols - 1)) * 2.8 - 1.4;


    /*
    Koordinat Y

    Dibalik supaya love
    menghadap normal.
    */

    const y =
      1.0 -
      (row / (rows - 1)) * 2.0;


    /*
    Rumus bentuk LOVE
    */

    const value =
      Math.pow(
        x * x + y * y - 1,
        3
      )
      -
      x * x *
      Math.pow(y, 3);


    /*
    Kalau titik berada
    DI DALAM love,
    kasih tulisan.
    */

    if (value <= 0) {

      words.push({

        x: x * 150,

        y: -y * 155,

        row: row,

        col: col

      });

    }

  }

}


/*
========================================
URUTAN MUNCUL
========================================

Dari bagian atas love
turun perlahan ke bawah.
*/

words.sort((a, b) => {

  /*
  urut berdasarkan baris
  */

  if (a.row !== b.row) {

    return a.row - b.row;

  }

  /*
  bagian tengah sedikit
  lebih dulu daripada ujung
  */

  return (
    Math.abs(a.col - cols / 2) -
    Math.abs(b.col - cols / 2)
  );

});


/*
========================================
MASUKKAN "i love you"
========================================
*/

words.forEach((item, index) => {

  const word =
    document.createElement("div");


  word.className = "word";


  word.textContent =
    "i love you";


  /*
  Campuran maroon + pink.
  */

  if (
    index % 9 === 0 ||
    index % 17 === 0
  ) {

    word.classList.add("pink");

  } else {

    word.classList.add("maroon");

  }


  /*
  Posisi
  */

  word.style.left =
    `calc(50% + ${item.x}px)`;


  word.style.top =
    `calc(50% + ${item.y}px)`;


  /*
  CEPAT.

  Setiap tulisan cuma
  berjarak 0.018 detik.
  */

  word.style.animationDelay =
    `${index * 0.018}s`;


  heart.appendChild(word);

});


/*
========================================
TEKS TERAKHIR
========================================
*/

const finishTime =
  words.length * 18 + 700;


setTimeout(() => {

  finalText.classList.add("show");

}, finishTime);

</script>

</body>
</html>
